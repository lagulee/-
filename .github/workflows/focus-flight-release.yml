name: Focus Flight 빌드 (Windows·Android)

on:
  push:
    paths:
      - 'focus-flight/**'
      - '.github/workflows/focus-flight-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: focus-flight
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: focus-flight/package-lock.json

      - run: npm ci
      # 앱 버전을 릴리스 번호와 맞춘다 (새 버전이 이전 버전을 자동으로 교체할 때 비교에 쓰임)
      - run: npm version 0.1.${{ github.run_number }} --no-git-tag-version --allow-same-version
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: 설치 파일·포터블 exe 만들기
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Windows 실행 테스트 (창 감지·3D 화면)
        shell: pwsh
        run: |
          $dir = Join-Path $PWD 'smoke'
          $p = Start-Process -FilePath 'dist/win-unpacked/Focus Flight.exe' -ArgumentList "--smoke-test=$dir" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw '실행 테스트 시간 초과' }
          Get-Content (Join-Path $dir 'report.json')
          if ($p.ExitCode -ne 0) { throw "실행 테스트 실패 (exit $($p.ExitCode))" }
          Copy-Item (Join-Path $dir 'screenshot.png') 'dist/Windows-test-screenshot.png'

      - name: 예전 버전(0.1.1)이 켜져 있을 때 교체되는지 테스트
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/lagulee/-/releases/download/focus-flight-v0.1.1/FocusFlight-Portable.exe' -OutFile old-portable.exe
          Start-Process (Resolve-Path old-portable.exe).Path
          Start-Sleep -Seconds 25
          $before = @(Get-Process -Name 'Focus Flight' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Path -Unique)
          "실행 중 (새 버전 실행 전): $($before -join ', ')"
          if ($before.Count -eq 0) { throw '0.1.1이 실행되지 않았습니다' }
          $new = (Resolve-Path 'dist/win-unpacked/Focus Flight.exe').Path
          Start-Process $new
          Start-Sleep -Seconds 25
          $after = @(Get-Process -Name 'Focus Flight' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Path -Unique)
          "실행 중 (새 버전 실행 후): $($after -join ', ')"
          Get-Process -Name 'Focus Flight' -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Process -Name 'old-portable' -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($after.Count -eq 1 -and $after[0] -eq $new) { '교체 성공' } else { throw '예전 버전이 남아 있거나 새 버전이 실행되지 않았습니다' }

      - name: 실행 테스트 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: focus-flight/smoke/*.*

      - name: 브라우저 확장 압축
        shell: pwsh
        run: Compress-Archive -Path extension/* -DestinationPath dist/FocusFlight-Extension.zip

      - uses: actions/upload-artifact@v4
        with:
          name: focus-flight-windows
          path: |
            focus-flight/dist/*.exe
            focus-flight/dist/*.zip
            focus-flight/dist/Windows-test-screenshot.png

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: focus-flight
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: focus-flight/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          # 기본값('tools')은 더 이상 없는 패키지라 실패하므로 필요한 것만 지정
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - run: npm ci
      - run: npm version 0.1.${{ github.run_number }} --no-git-tag-version --allow-same-version
      - run: npm run build:mobile
      - run: npx cap sync android

      - name: APK 만들기
        working-directory: focus-flight/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace -PffVersionCode=${{ github.run_number }} -PffVersionName=0.1.${{ github.run_number }}
          mkdir -p ../dist-android
          cp app/build/outputs/apk/release/app-release.apk ../dist-android/FocusFlight-Android.apk

      - name: 에뮬레이터용 KVM 켜기
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 안드로이드 에뮬레이터 실행 테스트 (앱 감지)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: focus-flight
          script: |
            adb install -r dist-android/FocusFlight-Android.apk
            adb shell appops set com.lagulee.focusflight GET_USAGE_STATS allow
            adb shell pm grant com.lagulee.focusflight android.permission.POST_NOTIFICATIONS
            adb logcat -c
            adb shell am start -n com.lagulee.focusflight/.MainActivity
            sleep 40
            adb exec-out screencap -p > dist-android/Android-test-screenshot.png
            adb shell am start -a android.settings.SETTINGS
            sleep 8
            adb shell am start -n com.lagulee.focusflight/.MainActivity
            sleep 10
            adb exec-out screencap -p > dist-android/Android-test-after.png
            adb shell dumpsys window | grep -E "mCurrentFocus|mFocusedApp" | head -3
            adb logcat -d > dist-android/logcat.txt
            grep -E "FocusFlight|Capacitor|AndroidRuntime|FATAL" dist-android/logcat.txt | tail -60
            grep -q "\[ff\] foreground: com.android.settings blocked" dist-android/logcat.txt
            grep -q "\[ff\] foreground: com.lagulee.focusflight allowed" dist-android/logcat.txt

      - name: 테스트 기록 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test
          path: focus-flight/dist-android/*

      # 실패했을 때도 화면과 로그를 볼 수 있게 테스트 전용 사전 릴리스에 올린다 (사용자용 릴리스와 별개)
      - name: 테스트 화면·로그 공개 (android-test)
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test
          name: Android 자동 테스트 기록 (사용자용 아님)
          prerelease: true
          make_latest: false
          body: CI 에뮬레이터 테스트의 최근 화면과 로그입니다. 앱 설치는 최신 정식 릴리스에서 하세요.
          files: |
            focus-flight/dist-android/*.png
            focus-flight/dist-android/logcat.txt

      - uses: actions/upload-artifact@v4
        with:
          name: focus-flight-android
          path: |
            focus-flight/dist-android/*.apk
            focus-flight/dist-android/Android-test-screenshot.png

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: focus-flight-*
          merge-multiple: true
          path: dist

      - name: 릴리스에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: focus-flight-v0.1.${{ github.run_number }}
          name: Focus Flight 0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            ## PC (Windows)
            - **FocusFlight-Portable.exe** — 내려받아 더블클릭하면 바로 실행 (설치 없음)
            - **FocusFlight-Setup.exe** — 시작 메뉴에 등록되는 일반 설치 버전
            - **FocusFlight-Extension.zip** — (선택) 플레이리스트만 허용하는 브라우저 확장

            처음 실행할 때 "Windows의 PC 보호" 창이 뜨면 **추가 정보 → 실행**을 누르세요.

            ## 안드로이드
            - **FocusFlight-Android.apk** — 휴대폰에서 이 페이지를 열고 눌러서 내려받은 뒤 설치
            - 설치할 때 "출처를 알 수 없는 앱" 허용이 필요합니다
            - 처음 실행하면 **설정 → 사용 기록 접근**에서 Focus Flight를 허용해 주세요 (앱 감지용)
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.apk
            dist/*.png
