name: SilentCamera debug APK

on:
  push:
    paths:
      - "silent-camera/**"
      - ".github/workflows/silent-camera-debug.yml"
  workflow_dispatch:

concurrency:
  group: silent-camera-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # 릴리스 생성·APK 업로드

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: silent-camera
    steps:
      - uses: actions/checkout@v5

      # 무음 보장: 셔터음을 강제로 내는 API가 코드에 들어오면 빌드를 실패시킨다.
      - name: Guard against shutter-sound APIs
        run: |
          if grep -rnE "ImageCapture|MediaActionSound|VideoCapture" app/src; then
            echo "::error::ImageCapture / MediaActionSound / VideoCapture 사용 금지"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # ubuntu-latest 러너에는 Android SDK가 이미 설치되어 있고(ANDROID_HOME), 부족한 플랫폼은 AGP가 자동으로 받는다.

      - uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK, unit tests, lint
        run: ./gradlew --stacktrace assembleDebug testDebugUnitTest lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: silent-camera-debug-apk-${{ github.run_number }}
          path: silent-camera/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # 로그인 없이 받을 수 있도록 고정 태그의 프리릴리스에 APK를 올린다.
      # 다른 프로젝트(Focus Flight)의 "Latest" 릴리스를 건드리지 않도록 make_latest=false.
      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SilentCamera-debug.apk

      - name: Move rolling tag to this commit
        run: |
          git tag -f silent-camera-debug-latest "$GITHUB_SHA"
          git push -f origin refs/tags/silent-camera-debug-latest

      - name: Publish debug APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: silent-camera-debug-latest
          name: "무음 카메라 디버그 빌드 (최신)"
          prerelease: true
          make_latest: "false"
          overwrite_files: true
          files: silent-camera/SilentCamera-debug.apk
          body: |
            무음 카메라 최신 디버그 APK입니다. 푸시할 때마다 자동으로 갱신됩니다.

            - 브랜치: `${{ github.ref_name }}`
            - 커밋: ${{ github.sha }}
            - 빌드: #${{ github.run_number }} (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            설치: 아래 `SilentCamera-debug.apk`를 폰에서 받아 실행 (출처를 알 수 없는 앱 설치 허용 필요)

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: silent-camera-reports-${{ github.run_number }}
          path: |
            silent-camera/app/build/reports/
            silent-camera/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
