name: WiFi Scanner debug APK

on:
  push:
    branches:
      - "claude/project-thread-9bkleq"
      - "ccr-77eba041-n8cd7s"
  workflow_dispatch:

concurrency:
  group: wifi-scanner-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # 릴리스 생성·APK 업로드

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Parser unit tests
        run: ./gradlew --stacktrace -p wifiparser test

      - name: Build debug APK
        run: ./gradlew --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: wifi-scanner-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk WifiScanner-debug.apk

      - name: Move rolling tag to this commit
        run: |
          git tag -f wifi-scanner-debug-latest "$GITHUB_SHA"
          git push -f origin refs/tags/wifi-scanner-debug-latest

      - name: Publish debug APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wifi-scanner-debug-latest
          name: "WiFi 스캐너 디버그 빌드 (최신)"
          prerelease: true
          make_latest: "false"
          overwrite_files: true
          files: WifiScanner-debug.apk
          body: |
            WiFi 스캐너 최신 디버그 APK입니다. 푸시할 때마다 갱신됩니다.

            - 브랜치: `${{ github.ref_name }}`
            - 커밋: ${{ github.sha }}
            - 빌드: #${{ github.run_number }}

            설치: `WifiScanner-debug.apk`를 폰(Android 11 이상)에서 받아 실행 (출처를 알 수 없는 앱 설치 허용 필요)
